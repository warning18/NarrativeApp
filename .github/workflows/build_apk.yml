name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A branch that gets several follow-up pushes in quick succession (common
# mid-session) otherwise leaves every earlier run building to completion
# even though its result is already superseded. Cancel those instead.
# Only on PRs: on main, every push publishes a release, and cancelling a
# run there would skip that release when the next merge lands quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs that need more (the release step in
# `build`) grant it explicitly on themselves instead of it being ambient
# for every job in this workflow, present and future.
permissions:
  contents: read

jobs:
  secret-scan:
    # Gates every push and PR on no API key, token, or other credential
    # being present anywhere in the diff -- this repo is private today,
    # but nothing about that is permanent, and a leaked secret in git
    # history doesn't un-leak itself if the repo is ever made public or a
    # collaborator is added. Runs before the (much slower) Flutter build so
    # a real finding fails fast.
    runs-on: ubuntu-latest
    permissions:
      # The workflow-level `permissions:` above is contents: read only,
      # which zeroes every other scope -- including pull-requests, which
      # gitleaks-action needs to list a PR's commits via the API. Grant
      # that back for this job only.
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Gitleaks needs real history to diff against, not just the tip
          # commit -- this repo is a couple MB, so fetching it all is cheap.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Format and analyze: fast, and independent of the tests, so they run
  # beside them instead of before them.
  # Flutter is pinned (flutter-version below, in every job that sets it up and
  # in format.yml). A bare `channel: stable` took whatever stable was that
  # minute: on 11 November 2026 a new stable landed between two merges, its
  # analyzer flagged every `package:flutter/material.dart` import and its
  # Gradle step wanted a newer Android Gradle Plugin, so every pull request
  # and the release build failed with no change of ours. Raise the version on
  # purpose, in its own pull request, with whatever the new one asks for.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  # The suite, split by file across four runners, balanced by how long each
  # file takes (tool/shard_tests.py, weights in test/shard_weights.json; the
  # script fails if a file is dropped or doubled). One runner took about 17
  # minutes for the whole suite. Whole files, not flutter test's own
  # --total-shards (which splits a file's tests across runners and breaks
  # the few tests that lean on a sibling run earlier in the same file).
  #
  # Two groups of files are gated (tool/sim_gate.txt): the four that play whole
  # simulated runs (about 160 s together: the boss curve, the clash gap, the
  # story coverage, the adapt gap) and the three big screen smoke tests (about
  # 90 s). A pull request that changes none of a group's trigger paths cannot
  # move what it measures, so its shards leave that group out and split the
  # rest again; main, and any pull request that touches a trigger path, run
  # the whole suite.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A pull request is checked out as a merge commit: HEAD^1 is the
          # base, so two commits are enough to list what the PR changes.
          fetch-depth: 2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests (shard ${{ matrix.shard }} of 4)
        run: |
          python3 tool/shard_tests.py --check 4
          changed=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
            changed="--changed $RUNNER_TEMP/changed.txt"
          fi
          # Says on stderr which gated groups (tool/sim_gate.txt) it leaves out.
          files=$(python3 tool/shard_tests.py ${{ matrix.shard }} 4 $changed)
          echo "$(echo "$files" | wc -l) test files in this shard"
          flutter test $files

  # The release APK, built beside the tests rather than after them.
  apk:
    runs-on: ubuntu-latest
    env:
      # When these repository secrets are set (Settings > Secrets and
      # variables > Actions), every release APK is signed with the same
      # stable key, so Android accepts each new build as an in-place update
      # instead of requiring an uninstall. Without them, the build falls
      # back to Flutter's default debug signing (unsigned-for-updates, but
      # still installable) so CI keeps working before the secrets exist.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # Keeps the check name `build` that PRs have always reported. It passes
  # only when every job above passed (a skipped job would otherwise count
  # as a pass), and on a push to main it publishes the release.
  build:
    needs: [secret-scan, checks, test, apk]
    # A run cancelled because a newer push superseded it reports nothing
    # rather than a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # Only the release step (push-to-main only) actually writes anything
      # (a tag + a GitHub Release).
      contents: write
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A job failed or was cancelled: ${{ toJSON(needs) }}"
          exit 1

      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Download APK
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: build/app/outputs/flutter-apk

      - name: Extract version
        # Only a push to main produces a real release; a pull_request run is
        # a pre-merge check and never tags one.
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
