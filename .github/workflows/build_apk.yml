name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A branch that gets several follow-up pushes in quick succession (common
# mid-session) otherwise leaves every earlier run building to completion
# even though its result is already superseded. Cancel those instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs that need more (the release step in
# `build`) grant it explicitly on themselves instead of it being ambient
# for every job in this workflow, present and future.
permissions:
  contents: read

jobs:
  secret-scan:
    # Gates every push and PR on no API key, token, or other credential
    # being present anywhere in the diff -- this repo is private today,
    # but nothing about that is permanent, and a leaked secret in git
    # history doesn't un-leak itself if the repo is ever made public or a
    # collaborator is added. Runs before the (much slower) Flutter build so
    # a real finding fails fast.
    runs-on: ubuntu-latest
    permissions:
      # The workflow-level `permissions:` above is contents: read only,
      # which zeroes every other scope -- including pull-requests, which
      # gitleaks-action needs to list a PR's commits via the API. Grant
      # that back for this job only.
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Gitleaks needs real history to diff against, not just the tip
          # commit -- this repo is a couple MB, so fetching it all is cheap.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      # Only the release step (push-to-main only) actually writes anything
      # (a tag + a GitHub Release); every other step here is read-only.
      contents: write
    env:
      # When these repository secrets are set (Settings > Secrets and
      # variables > Actions), every release APK is signed with the same
      # stable key, so Android accepts each new build as an in-place update
      # instead of requiring an uninstall. Without them, the build falls
      # back to Flutter's default debug signing (unsigned-for-updates, but
      # still installable) so CI keeps working before the secrets exist.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Caches the SDK itself and (internally, keyed on pubspec.lock)
          # the pub package cache -- was off, so every run paid the full
          # ~60s SDK install plus a fresh `pub get` download every time.
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        # Was non-blocking until the codebase was actually run through
        # `dart format` for real (see .github/workflows/format.yml --
        # there's no local Dart SDK in the dev environment to have
        # verified this before adding the gate). Now a real gate.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Extract version
        # Only a push to main produces a real release; a pull_request run is
        # a pre-merge check (analyze/test/build) and should never tag one.
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk