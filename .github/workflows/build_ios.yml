name: Build iOS

# Checks the iPhone build on pull requests that touch what it depends on,
# and builds one by hand on any branch (Actions > Build iOS > Run
# workflow); the IPA is kept as the run's artifact. Releases get their IPA
# from build_apk.yml, next to the APK. An iPhone build needs a Mac, and
# macOS minutes count ten times against a private repo's Actions quota, so
# this doesn't run on every push. Analyze and the tests run in
# build_apk.yml; this job only builds.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios.yml'
      - '.github/actions/build-ios/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the IPA
        id: ipa
        uses: ./.github/actions/build-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.path }}
