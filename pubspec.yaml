name: narrative_data_app
description: "An interactive narrative reader with a story map and AI-assisted generation."
publish_to: 'none'
version: 1.149.0+178

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.3
  google_generative_ai: ^0.4.0
  http: ^1.2.0
  graphview: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    # The world map's lettering (SIL Open Font License, see
    # assets/fonts/PixelifySans-OFL.txt).
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
        - asset: assets/fonts/PixelifySans-SemiBold.ttf
          weight: 600
    # The world map's text (SIL Open Font License, see
    # assets/fonts/Spectral-OFL.txt).
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
  assets:
    - assets/Cleaned_Narrative_DAG.json
    - assets/fonts/PixelifySans-OFL.txt
    - assets/fonts/Spectral-OFL.txt
    - assets/gamedata/items.json
    - assets/gamedata/item_sets.json
    - assets/gamedata/skills.json
    - assets/gamedata/skill_merges.json
    - assets/gamedata/skill_trees.json
    - assets/gamedata/dice.json
    - assets/gamedata/enemies.json
    - assets/gamedata/enemy_ships.json
    - assets/gamedata/ships.json
    - assets/gamedata/ship_parts.json
    - assets/gamedata/quests.json
    - assets/gamedata/shops.json
    - assets/gamedata/gates.json
    - assets/gamedata/adventure_nodes.json
    - assets/gamedata/game_config.json
    - assets/gamedata/races.json
    - assets/gamedata/professions.json
    - assets/gamedata/companions.json
    - assets/gamedata/houses.json
    - assets/gamedata/achievements.json
    - assets/gamedata/zones.json
    - assets/gamedata/ports.json
    - assets/gamedata/chapters.json
    - assets/gamedata/npcs.json
    - assets/gamedata/spells.json
    - assets/visuals/items/
    - assets/visuals/skills/
    - assets/visuals/dice/
    - assets/visuals/enemies/
    - assets/visuals/enemy_ships/
    - assets/visuals/ships/
    - assets/visuals/ship_parts/
    - assets/visuals/quests/
    - assets/visuals/shops/
    - assets/visuals/gates/
    - assets/visuals/adventure_nodes/
    - assets/visuals/races/
    - assets/visuals/professions/
    - assets/icons/items/
    - assets/icons/skills/
    - assets/icons/enemies/
    - assets/icons/shops/
    - assets/icons/chests/
    - assets/visuals/companion/
    - assets/visuals/companion/dog_companion_animations/Walking/east/
    - assets/visuals/companion/dog_companion_animations/Walking/north/
    - assets/visuals/companion/dog_companion_animations/Fight_-_Attack/animations/Bark/south/
    - assets/visuals/companion/dog_companion_animations/Sitting_down/rotations/
    - assets/visuals/companion/dog_companion_animations/Make_it_with_angel_w/rotations/
    - assets/visuals/companion/dog_companion_animations/Make_it_with_demon_w/rotations/
